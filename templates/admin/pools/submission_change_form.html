{% extends "admin/change_form.html" %}

{% block submit_buttons_bottom %}
<div class="submit-row">
  <input type="submit" value="Save and return to queue">
  <input type="submit" name="_continue" value="Save and continue editing">
  <input type="submit" name="_reparse" value="Reparse with LLM"
         title="Re-run LLM parsing on the original URL or image">
  <input type="submit" name="_apply" value="Apply to pool →"
         class="default"
         style="text-transform:none"
         title="Apply the parsed fields above to the linked pool">
  {% if original.uploaded_image and original.parsed_pool_id %}
  <label style="display:inline-flex;align-items:center;gap:6px;margin-left:.5em;font-weight:normal;cursor:pointer">
    <input type="checkbox" name="_set_display_image">
    Display image on pool details page
  </label>
  {% endif %}
  <a href="{% url 'admin:pools_submission_reparse' original.pk %}"
     class="button"
     style="display:inline-block;padding:10px 15px;background:#79aec8;color:#fff;text-decoration:none;border-radius:4px;cursor:pointer"
     title="Run LLM on this source to extract every pool mentioned">
    Re-parse for all pools &rarr;
  </a>
</div>
{% endblock %}
