[build]
buildCommand = "python manage.py collectstatic --noinput"

[deploy]
startCommand = "if [ \"$RAILWAY_SERVICE_NAME\" = \"url-watcher\" ]; then python manage.py run_url_watcher; else python manage.py migrate --noinput && gunicorn phillypools.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120; fi"
healthcheckPath = "/"
healthcheckTimeout = 30
